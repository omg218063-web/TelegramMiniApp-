<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RS Tap-to-Earn - Home</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #07070b;
            --card-bg: #12131c;
            --gold-primary: #facc15;
            --text-main: #ffffff;
            --text-muted: #94a3b8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        .app-container {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            padding-bottom: 85px;
        }

        /* Top Header Balance */
        .balance-card {
            background: linear-gradient(145deg, #181926, #0f1017);
            border: 1px solid rgba(250, 204, 21, 0.3);
            border-radius: 20px;
            padding: 18px;
            text-align: center;
            box-shadow: 0 8px 25px rgba(0,0,0,0.6);
            margin-bottom: 20px;
        }

        .balance-card h2 {
            font-size: 30px;
            color: var(--gold-primary);
            font-weight: 900;
            text-shadow: 0 0 10px rgba(250, 204, 21, 0.4);
        }

        .balance-card p {
            color: var(--text-muted);
            font-size: 13px;
            margin-top: 4px;
        }

        /* Tap Section & Logo */
        .tap-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin: 20px 0;
        }

        .logo-container {
            position: relative;
            width: 210px;
            height: 210px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            user-select: none;
        }

        .ring-gold {
            position: absolute;
            width: 100%;
            height: 100%;
            border: 4px solid #facc15;
            border-radius: 50%;
            box-shadow: 0 0 15px rgba(250, 204, 21, 0.6);
            animation: spin 12s linear infinite;
        }

        .ring-blue {
            position: absolute;
            width: 84%;
            height: 84%;
            border: 3px solid #38bdf8;
            border-radius: 50%;
            box-shadow: 0 0 10px rgba(56, 189, 248, 0.5);
            animation: spin-reverse 8s linear infinite;
        }

        .ring-purple {
            position: absolute;
            width: 68%;
            height: 68%;
            border: 3px solid #c084fc;
            border-radius: 50%;
            opacity: 0.8;
        }

        .center-logo-btn {
            width: 125px;
            height: 125px;
            background: radial-gradient(circle, #1e1b4b, #09090b);
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: inset 0 0 15px rgba(56, 189, 248, 0.4), 0 0 20px rgba(0,0,0,0.9);
            border: 2px solid rgba(255,255,255,0.15);
            z-index: 2;
            transition: transform 0.08s ease;
        }

        .center-logo-btn:active {
            transform: scale(0.92);
        }

        .center-logo-btn h1 {
            font-size: 28px;
            background: linear-gradient(to right, #cbd5e1, #facc15);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 900;
        }

        /* Floating Score Animation (Larger & Multi-color with RS) */
        .floating-score {
            position: absolute;
            font-weight: 900;
            font-size: 26px;
            animation: floatUp 0.8s ease-out forwards;
            pointer-events: none;
            z-index: 10;
            text-shadow: 0 2px 5px rgba(0,0,0,0.8);
        }

        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0) scale(1); }
            100% { opacity: 0; transform: translateY(-70px) scale(1.4); }
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes spin-reverse {
            0% { transform: rotate(360deg); }
            100% { transform: rotate(0deg); }
        }

        /* Daily Task & Timer Section */
        .task-timer-box {
            background: var(--card-bg);
            border: 1px solid rgba(250, 204, 21, 0.2);
            border-radius: 14px;
            padding: 15px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .task-info h4 {
            font-size: 15px;
            color: var(--gold-primary);
        }

        .task-info p {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 2px;
        }

        .timer-badge {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid #ef4444;
            color: #fca5a5;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: bold;
        }

        /* Ads Section Banner */
        .ads-section-title {
            text-align: center;
            color: var(--gold-primary);
            font-size: 16px;
            margin-bottom: 12px;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .ads-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 20px;
        }

        .ad-card {
            background: linear-gradient(135deg, #1e1b4b, #0f172a);
            border: 2px solid var(--gold-primary);
            border-radius: 14px;
            padding: 12px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(250, 204, 21, 0.15);
        }

        .ad-card h3 {
            font-size: 20px;
            color: var(--gold-primary);
            margin-bottom: 4px;
        }

        .ad-card span {
            font-size: 12px;
            color: var(--text-muted);
        }

        /* Bottom Navigation (5 Icons Only) */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 70px;
            background-color: var(--card-bg);
            display: flex;
            justify-content: space-around;
            align-items: center;
            border-top: 1px solid rgba(250, 204, 21, 0.2);
            z-index: 100;
        }

        .nav-item {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 22px;
            cursor: pointer;
            padding: 10px;
            transition: color 0.2s;
        }

        .nav-item.active {
            color: var(--gold-primary);
            text-shadow: 0 0 10px rgba(250, 204, 21, 0.6);
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- Top Header Balance with RS -->
        <div class="balance-card">
            <h2 id="balance-display">50,000 RS</h2>
            <p>≈ <span id="bdt-display">7,500.00</span> BDT (1M = 150 BDT)</p>
        </div>

        <!-- Tap Logo Section -->
        <div class="tap-section">
            <div class="logo-container" id="tap-target">
                <div class="ring-gold"></div>
                <div class="ring-blue"></div>
                <div class="ring-purple"></div>
                <div class="center-logo-btn">
                    <h1>RS</h1>
                </div>
            </div>
        </div>

        <!-- Daily Task & 2 Hours Timer Box with RS -->
        <div class="task-timer-box">
            <div class="task-info">
                <h4>Daily Task Reward</h4>
                <p>200 RS Token Bonus</p>
            </div>
            <div class="timer-badge" id="countdown-timer">01:59:45</div>
        </div>

        <!-- Ads Section Banner with RS -->
        <div class="ads-section-title">⭐ ADS REWARD SYSTEM ⭐</div>
        <div class="ads-grid">
            <div class="ad-card">
                <h3>1,200 RS</h3>
                <span>Watch Ad 1</span>
            </div>
            <div class="ad-card">
                <h3>600 RS</h3>
                <span>Watch Ad 2</span>
            </div>
            <div class="ad-card">
                <h3>900 RS</h3>
                <span>Watch Ad 3</span>
            </div>
            <div class="ad-card">
                <h3>1,400 RS</h3>
                <span>Watch Ad 4</span>
            </div>
        </div>
    </div>

    <!-- Bottom Navigation (5 Icons Only) -->
    <div class="bottom-nav">
        <button class="nav-item active"><i class="fas fa-home"></i></button>
        <button class="nav-item"><i class="fas fa-trophy"></i></button>
        <button class="nav-item"><i class="fas fa-users"></i></button>
        <button class="nav-item"><i class="fas fa-headset"></i></button>
        <button class="nav-item"><i class="fas fa-user-circle"></i></button>
    </div>

    <script>
        let balance = 50000;
        const rate = 150 / 1000000;
        const possibleRewards = [1, 2, 3, 5, 10]; // ট্যাপে ৩ বা ১০ সহ বিভিন্ন পয়েন্ট
        const rewardColors = ['#facc15', '#38bdf8', '#c084fc', '#22c55e', '#ec4899'];

        function updateUI() {
            document.getElementById('balance-display').innerText = balance.toLocaleString() + " RS";
            document.getElementById('bdt-display').innerText = (balance * rate).toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2});
        }

        const tapTest = document.getElementById('tap-target');
        tapTest.addEventListener('click', (e) => {
            let reward = possibleRewards[Math.floor(Math.random() * possibleRewards.length)];
            let color = rewardColors[Math.floor(Math.random() * rewardColors.length)];

            balance += reward;
            updateUI();

            // Floating score effect with RS
            let rect = tapTest.getBoundingClientRect();
            let x = e.clientX - rect.left;
            let y = e.clientY - rect.top;

            let floatText = document.createElement('div');
            floatText.className = 'floating-score';
            floatText.innerText = `+${reward} RS`;
            floatText.style.left = `${x}px`;
            floatText.style.top = `${y}px`;
            floatText.style.color = color;

            tapTest.appendChild(floatText);
            setTimeout(() => {
                floatText.remove();
            }, 800);
        });

        updateUI();
    </script>
</body>
</html>

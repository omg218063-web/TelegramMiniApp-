<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RS Tap to Earn</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: linear-gradient(135deg, #0f172a, #1e1b4b, #311042);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 20px;
            overflow: hidden;
        }
        .header {
            text-align: center;
            margin-top: 10px;
        }
        .header h1 {
            font-size: 24px;
            color: #facc15;
            text-shadow: 0 0 10px rgba(250, 204, 21, 0.5);
            margin-bottom: 5px;
        }
        .header p {
            font-size: 14px;
            color: #94a3b8;
        }
        .score-board {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 15px 30px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }
        .score-board h2 {
            font-size: 38px;
            color: #38bdf8;
            font-weight: bold;
        }
        .score-board span {
            font-size: 14px;
            color: #cbd5e1;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .tap-container {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 20px 0;
        }
        .coin-btn {
            width: 180px;
            height: 180px;
            border-radius: 50%;
            background: radial-gradient(circle, #fbbf24, #d97706);
            border: 6px solid #fef3c7;
            box-shadow: 0 0 30px rgba(251, 191, 36, 0.6), inset 0 0 15px rgba(0, 0, 0, 0.3);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 60px;
            transition: transform 0.1s ease, box-shadow 0.1s ease;
            outline: none;
            user-select: none;
        }
        .coin-btn:active {
            transform: scale(0.92);
            box-shadow: 0 0 15px rgba(251, 191, 36, 0.8);
        }
        .footer-stats {
            display: flex;
            justify-content: space-around;
            width: 100%;
            max-width: 350px;
            background: rgba(15, 23, 42, 0.6);
            padding: 12px;
            border-radius: 15px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .stat-item {
            text-align: center;
        }
        .stat-item .label {
            font-size: 12px;
            color: #64748b;
        }
        .stat-item .value {
            font-size: 16px;
            color: #f8fafc;
            font-weight: 600;
        }
        .floating-text {
            position: absolute;
            color: #facc15;
            font-weight: bold;
            font-size: 20px;
            animation: floatUp 0.8s ease-out forwards;
            pointer-events: none;
        }
        @keyframes floatUp {
            0% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
            100% {
                opacity: 0;
                transform: translateY(-80px) scale(1.3);
            }
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>RS Tap to Earn</h1>
        <p>ট্যাপ করুন আর কয়েন জিতুন!</p>
    </div>

    <div class="score-board">
        <span id="score">0</span>
        <br>
        <span>RS Coins</span>
    </div>

    <div class="tap-container" id="tapContainer">
        <button class="coin-btn" id="coinBtn">🪙</button>
    </div>

    <div class="footer-stats">
        <div class="stat-item">
            <div class="label">Energy</div>
            <div class="value" id="energy">1000/1000</div>
        </div>
        <div class="stat-item">
            <div class="label">Per Tap</div>
            <div class="value">+1</div>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        let score = 0;
        let energy = 1000;
        const scoreElement = document.getElementById('score');
        const coinBtn = document.getElementById('coinBtn');
        const tapContainer = document.getElementById('tapContainer');
        const energyElement = document.getElementById('energy');

        coinBtn.addEventListener('click', (e) => {
            if (energy > 0) {
                score += 1;
                energy -= 1;
                scoreElement.textContent = score;
                energyElement.textContent = `${energy}/1000`;

                const rect = coinBtn.getBoundingClientRect();
                const x = e.clientX - rect.left - 20;
                const y = e.clientY - rect.top - 20;

                const floatText = document.createElement('div');
                floatText.className = 'floating-text';
                floatText.textContent = '+1';
                floatText.style.left = `${x}px`;
                floatText.style.top = `${y}px`;
                tapContainer.appendChild(floatText);

                setTimeout(() => {
                    floatText.remove();
                }, 800);

                if (tg && tg.HapticFeedback) {
                    tg.HapticFeedback.impactOccurred('light');
                }
            }
        });
    </script>
</body>
  </html>

<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <title>RS Tap to Earn - Complete Mini App</title>
    <style>
        body { background: #0f172a; color: #fff; font-family: sans-serif; text-align: center; margin: 0; padding: 20px; }
        .container { max-width: 450px; margin: auto; background: #1e293b; padding: 20px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        .btn { background: #3b82f6; color: white; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-weight: bold; margin: 10px 0; width: 100%; }
        .input-box { width: 90%; padding: 10px; margin: 10px 0; border-radius: 5px; border: 1px solid #475569; background: #0f172a; color: #fff; }
        
        /* Tap Target & Rings */
        #tap-target { position: relative; width: 180px; height: 180px; margin: 20px auto; display: flex; align-items: center; justify-content: center; cursor: pointer; border-radius: 50%; background: radial-gradient(circle, #3b82f6, #1e3a8a); }
        .ring { position: absolute; border: 2px solid rgba(59, 130, 246, 0.6); border-radius: 50%; animation: pulse-ring 2s infinite; }
        .ring-1 { width: 120%; height: 120%; animation-delay: 0s; }
        .ring-2 { width: 140%; height: 140%; animation-delay: 0.6s; }
        .ring-3 { width: 160%; height: 160%; animation-delay: 1.2s; }
        @keyframes pulse-ring { 0% { transform: scale(0.8); opacity: 1; } 100% { transform: scale(1.2); opacity: 0; } }
        @keyframes floatUp { 0% { transform: translateY(0) scale(0.8); opacity: 1; } 100% { transform: translateY(-70px) scale(1.2); opacity: 0; } }
        .floating-text { position: absolute; font-weight: bold; font-size: 20px; animation: floatUp 0.8s ease-out forwards; pointer-events: none; }

        /* Ranking Table */
        .ranking-box { margin-top: 20px; background: #334155; padding: 15px; border-radius: 10px; max-height: 250px; overflow-y: auto; text-align: left; }
        .rank-item { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid #475569; font-size: 13px; }
    </style>
</head>
<body>

<div class="container">
    <h2>RS Tap to Earn</h2>
    <p>Bot: @rs_tap_to_earn_2026_bot</p>
    
    <!-- Balance & Profile -->
    <h3>Balance: <span id="user-balance">50000</span> RS</h3>
    <p style="font-size: 13px; color: #38bdf8;">বাংলা মূল্যমান: <span id="bdt-value">৫০০</span> টাকা</p>

    <!-- Profile Section -->
    <div style="margin: 15px 0; background: #334155; padding: 10px; border-radius: 8px;">
        <input type="text" id="username-input" class="input-box" placeholder="আপনার নাম লিখুন"><br>
        <button class="btn" onclick="updateProfileName()">প্রোফাইল আপডেট</button>
    </div>

    <!-- Tap Section -->
    <div id="tap-target">
        <div class="ring ring-1"></div>
        <div class="ring ring-2"></div>
        <div class="ring ring-3"></div>
        <span style="font-size: 28px; font-weight: bold; z-index: 10; color: #ffd700;">RS</span>
        <div id="floating-points-container" style="position: absolute; width: 100%; height: 100%;"></div>
    </div>

    <!-- Referral Link Section -->
    <div style="margin-top: 15px; background: #334155; padding: 10px; border-radius: 8px;">
        <h4>রেফারেল সিস্টেম (আজীবন ৫%)</h4>
        <p style="font-size: 12px; color: #cbd5e1;">বন্ধুকে রেফার করলে ইনস্ট্যান্ট ১০০০ টোকেন পাবেন এবং তার আয়ের ৫% কমিশন আজীবন পাবেন।</p>
        <input type="text" id="ref-link" class="input-box" value="https://t.me/rs_tap_to_earn_2026_bot?start=ref_user123" readonly>
    </div>

    <!-- Ranking Board (Top 100 with Tiers & BDT Calculation) -->
    <div class="ranking-box">
        <h4 style="text-align: center; margin-top: 0;">র‍্যাঙ্কিং লিডারবোর্ড (টপ ১০০)</h4>
        <div id="leaderboard-list"></div>
    </div>

    <!-- Withdrawal Section -->
    <div style="margin-top: 20px; background: #334155; padding: 15px; border-radius: 10px;">
        <h4>উত্তোলন (Withdraw)</h4>
        <select id="withdraw-method" class="input-box">
            <option value="Bkash">বিকাশ (Bkash)</option>
            <option value="Nagad">নগদ (Nagad)</option>
        </select><br>
        <input type="number" id="withdraw-amount" class="input-box" placeholder="টাকা (Min: 400, Max: 5000)"><br>
        <input type="text" id="withdraw-number" class="input-box" placeholder="একাউন্ট নাম্বার"><br>
        <button class="btn" onclick="requestWithdrawal()">উত্তোলন করুন</button>
        <p id="withdraw-msg" style="font-size: 14px;"></p>
    </div>
</div>

<script>
    let balance = 50000; // Initial balance
    const conversionRate = 100; // প্রতি ১০০ টোকেনে ১ টাকা (উদাহরণস্বরূপ)

    const balanceDisplay = document.getElementById('user-balance');
    const bdtDisplay = document.getElementById('bdt-value');
    const tapTarget = document.getElementById('tap-target');
    const floatingContainer = document.getElementById('floating-points-container');

    const pointOptions = [
        { points: 1, color: '#60a5fa' },
        { points: 5, color: '#34d399' },
        { points: 10, color: '#fbbf24' },
        { points: 12, color: '#f43f5e' },
        { points: 20, color: '#a855f7' }
    ];

    function updateDisplay() {
        balanceDisplay.innerText = balance;
        let bdt = (balance / 100).toFixed(2); // ক্যালকুলেশন করে বাংলা টাকায় রূপান্তর
        bdtDisplay.innerText = bdt;
    }

    // Tap Animation & Random Points
    tapTarget.addEventListener('click', (e) => {
        let rand = Math.random();
        let chosen = rand > 0.95 ? pointOptions[4] : rand > 0.8 ? pointOptions[3] : rand > 0.6 ? pointOptions[2] : rand > 0.3 ? pointOptions[1] : pointOptions[0];
        
        balance += chosen.points;
        updateDisplay();

        let floatEl = document.createElement('div');
        floatEl.className = 'floating-text';
        floatEl.innerText = `+${chosen.points}`;
        floatEl.style.color = chosen.color;
        
        let rect = tapTarget.getBoundingClientRect();
        floatEl.style.left = `${e.clientX - rect.left - 10}px`;
        floatEl.style.top = `${e.clientY - rect.top - 10}px`;
        
        floatingContainer.appendChild(floatEl);
        setTimeout(() => floatEl.remove(), 800);
    });

    // Profile Update
    function updateProfileName() {
        let name = document.getElementById('username-input').value;
        if(name) alert(`প্রোফাইল নাম সফলভাবে পরিবর্তন হয়ে হয়েছে: ${name}`);
        else alert('দয়া করে সঠিক নাম লিখুন।');
    }

    // Generate Demo Ranking (Top 100 with Region, Grandmaster, Heroic, Diamond & BDT Amount)
    function generateLeaderboard() {
        let listContainer = document.getElementById('leaderboard-list');
        let html = '';
        
        for(let i = 1; i <= 100; i++) {
            let rankTitle = "";
            let tokens = 0;

            if(i === 1) {
                rankTitle = "🔥 Top 1 (Region)";
                tokens = 50000000; // 50 Million
            } else if(i === 2) {
                rankTitle = "💎 Grand Master";
                tokens = 30000000;
            } else if(i === 3) {
                rankTitle = "⭐ Heroic";
                tokens = 15000000;
            } else if(i <= 10) {
                rankTitle = "⭐ Heroic (5 Star)";
                tokens = 8000000 - (i * 500000);
            } else if(i <= 30) {
                rankTitle = "⭐ Heroic (2 Star)";
                tokens = 4000000 - (i * 100000);
            } else {
                rankTitle = "🔹 Diamond Rank";
                tokens = 1000000 - (i * 5000);
            }

            let bdtAmount = (tokens / 100).toLocaleString(); // টোকেন থেকে বাংলা টাকার হিসাব

            html += `<div class="rank-item">
                <span>#${i} Player ${i} (${rankTitle})</span>
                <span><b>${tokens.toLocaleString()} RS</b> (${bdtAmount} ৳)</span>
            </div>`;
        }
        listContainer.innerHTML = html;
    }
    generateLeaderboard();

    // Withdrawal Validation (Min 400, Max 5000)
    function requestWithdrawal() {
        let method = document.getElementById('withdraw-method').value;
        let amount = parseFloat(document.getElementById('withdraw-amount').value);
        let number = document.getElementById('withdraw-number').value;
        let msg = document.getElementById('withdraw-msg');

        if(isNaN(amount) || amount < 400) {
            msg.style.color = '#f43f5e';
            msg.innerText = "ত্রুটি: সর্বনিম্ন উত্তোলন ৪০০ টাকা হতে হবে!";
            return;
        }
        if(amount > 5000) {
            msg.style.color = '#f43f5e';
            msg.innerText = "ত্রুটি: সর্বোচ্চ উত্তোলন ৫,০০০ টাকার বেশি হতে পারবে না!";
            return;
        }
        if(balance < amount) {
            msg.style.color = '#f43f5e';
            msg.innerText = "ত্রুটি: আপনার অ্যাকাউন্টে পর্যাপ্ত পরিমাণ ব্যালেন্স নেই!";
            return;
        }
        if(!number) {
            msg.style.color = '#f43f5e';
            msg.innerText = "ত্রুটি: সঠিক একাউন্ট নাম্বার দিন!";
            return;
        }

        balance -= amount;
        updateDisplay();
        msg.style.color = '#34d399';
        msg.innerText = `${method}-এর মাধ্যমে ${amount} টাকার উত্তোলনের অনুরোধ সফল হয়েছে!`;
    }
</script>

</body>
</html>

/* =========================================================
   TAB SYSTEM
========================================================= */
function switchTab(tabName, element){
    document.querySelectorAll('.section-view').forEach(x=>{
        x.style.display='none';
    });

    document.querySelectorAll('.nav-item').forEach(x=>{
        x.classList.remove('active');
    });

    const target=document.getElementById(tabName+'View');

    if(target){
        target.style.display='block';
    }

    if(element){
        element.classList.add('active');
    }

    document.getElementById('mainContainer')
        .scrollTo({top:0,behavior:'smooth'});

    /* Load heavy sections only when opened */
    if(tabName==='leaderboard'){
        initLeaderboard();
    }

    if(tabName==='referral'){
        initReferral();
    }

    if(tabName==='account'){
        initTransactions();
    }
}


/* =========================================================
   BALANCE
========================================================= */
let userScore=1000710129929;

const balanceDisplay=
    document.getElementById('balanceDisplay');

const bdtValueDisplay=
    document.getElementById('bdtValueDisplay');

const accountBalance=
    document.getElementById('accountBalance');

function updateBalanceUI(){

    if(balanceDisplay){
        balanceDisplay.textContent=
            userScore.toLocaleString();
    }

    if(bdtValueDisplay){

        const bdt=
            (userScore/1000000)*250;

        bdtValueDisplay.textContent=
            '≈ '+bdt.toLocaleString(undefined,{
                minimumFractionDigits:2,
                maximumFractionDigits:2
            })+' BDT';
    }

    if(accountBalance){
        accountBalance.textContent=
            userScore.toLocaleString();
    }
}

updateBalanceUI();


/* =========================================================
   TAP TO EARN
========================================================= */
const tapBtn=
    document.getElementById('tapButton');

let tapTimer=null;

const pointSequence=[
    1,3,2,5,7,2,5,3,1,10
];

let pointIndex=0;

const pointColors={
    1:'#38bdf8',
    2:'#4ade80',
    3:'#c084fc',
    5:'#facc15',
    7:'#fb923c',
    10:'#f43f5e'
};

function tapEarn(e){

    const amount=
        pointSequence[pointIndex];

    pointIndex++;

    if(pointIndex>=pointSequence.length){
        pointIndex=0;
    }

    userScore+=amount;

    updateBalanceUI();

    tapBtn.classList.add('active');

    clearTimeout(tapTimer);

    tapTimer=setTimeout(()=>{
        tapBtn.classList.remove('active');
    },180);

    const rect=
        tapBtn.getBoundingClientRect();

    const x=
        (e.clientX || rect.left+rect.width/2)
        -rect.left;

    const y=
        (e.clientY || rect.top+rect.height/2)
        -rect.top;

    const floatEl=
        document.createElement('div');

    floatEl.className='floating-score';

    floatEl.textContent=
        '+'+amount+' RS';

    floatEl.style.left=x+'px';
    floatEl.style.top=y+'px';
    floatEl.style.color=
        pointColors[amount];

    tapBtn.appendChild(floatEl);

    setTimeout(()=>{
        if(floatEl.parentNode){
            floatEl.remove();
        }
    },800);
}

if(tapBtn){
    tapBtn.addEventListener(
        'pointerdown',
        tapEarn,
        {passive:true}
    );
}


/* =========================================================
   HOURLY BONUS
========================================================= */
const BONUS_AMOUNT=100;
const BONUS_TIME=60*60*1000;

let bonusReady=true;
let bonusEnd=0;

const bonusButton=
    document.getElementById('bonusButton');

function claimHourlyBonus(){

    if(!bonusReady){
        return;
    }

    userScore+=BONUS_AMOUNT;

    updateBalanceUI();

    bonusReady=false;

    bonusEnd=
        Date.now()+BONUS_TIME;

    try{
        localStorage.setItem(
            'rs_bonus_end',
            String(bonusEnd)
        );
    }catch(e){}

    updateBonusButton();
}

function updateBonusButton(){

    if(!bonusButton){
        return;
    }

    if(bonusReady){

        bonusButton.textContent='Claim';

        bonusButton.classList.remove(
            'disabled'
        );

        return;
    }

    const remaining=
        bonusEnd-Date.now();

    if(remaining<=0){

        bonusReady=true;

        try{
            localStorage.removeItem(
                'rs_bonus_end'
            );
        }catch(e){}

        bonusButton.textContent='Claim';

        bonusButton.classList.remove(
            'disabled'
        );

        return;
    }

    const totalSeconds=
        Math.ceil(remaining/1000);

    const h=
        Math.floor(totalSeconds/3600);

    const m=
        Math.floor(
            (totalSeconds%3600)/60
        );

    const s=
        totalSeconds%60;

    bonusButton.textContent=
        String(h).padStart(2,'0')+':' +
        String(m).padStart(2,'0')+':' +
        String(s).padStart(2,'0');

    bonusButton.classList.add('disabled');
}

try{

    const savedBonus=
        Number(
            localStorage.getItem(
                'rs_bonus_end'
            )
        );

    if(
        savedBonus &&
        savedBonus>Date.now()
    ){

        bonusReady=false;
        bonusEnd=savedBonus;

    }else{

        bonusReady=true;
    }

}catch(e){

    bonusReady=true;
}

setInterval(
    updateBonusButton,
    1000
);

updateBonusButton();


/* =========================================================

========================================================= */
const adContainer=

    );

const adCycleText=

    );

const cooldownBox=
    document.getElementById(
        'adCooldownBox'
    );

const cooldownCount=
    document.getElementById(
        'adCooldownCount'
    );

let completedAds=0;
let cooldownEnd=0;

function renderAds(){

    if(!adContainer){
        return;
    }

    const fragment=
        document.createDocumentFragment();

    for(let i=0;i<8;i++){

        const card=
            document.createElement('div');

        card.className=
            'ad-item-card';

        const done=
            i<completedAds;

        card.innerHTML=`
            <div class="ad-item-info">
                <h5>
                    <i class="fa-solid fa-bolt"></i>
                    Sponsor Ad #${i+1}
                </h5>

                <p>
                    Complete viewing • Reward 1,000 RS
                </p>
            </div>

            <button
                class="watch-ad-btn"
                ${done?'disabled':''}
                onclick="completeAd(${i})">

                ${done?'✓ Completed':'View Ad'}

            </button>
        `;

        fragment.appendChild(card);
    }

    adContainer.replaceChildren(
        fragment
    );

    if(adCycleText){
        adCycleText.textContent=
            completedAds+' / 8';
    }
}

function completeAd(index){

    if(index!==completedAds){

        alert(
            'Please complete the ads in order.'
        );

        return;
    }

    const buttons=
        document.querySelectorAll(
            '.watch-ad-btn'
        );

    const btn=buttons[index];

    if(!btn){
        return;
    }

    btn.disabled=true;
    btn.textContent='Verifying...';

    setTimeout(()=>{

        userScore+=1000;

        updateBalanceUI();

        completedAds++;

        if(completedAds>=8){

            startAdCooldown();

        }else{

            renderAds();
        }

    },2000);
}

function startAdCooldown(){

    completedAds=8;

    if(adContainer){
        adContainer.style.display='none';
    }

    if(cooldownBox){
        cooldownBox.style.display='block';
    }

    cooldownEnd=
        Date.now()+60000;

    updateCooldown();
}

function updateCooldown(){

    if(
        !cooldownBox ||
        cooldownBox.style.display==='none'
    ){
        return;
    }

    const remaining=
        cooldownEnd-Date.now();

    if(remaining<=0){

        completedAds=0;

        if(adContainer){
            adContainer.style.display='flex';
        }

        cooldownBox.style.display='none';

        renderAds();

        return;
    }

    const seconds=
        Math.ceil(remaining/1000);

    const mm=
        Math.floor(seconds/60);

    const ss=
        seconds%60;

    if(cooldownCount){

        cooldownCount.textContent=
            String(mm).padStart(2,'0')+':' +
            String(ss).padStart(2,'0');
    }
}

setInterval(
    updateCooldown,
    500
);

/* Home ads are lightweight, so load immediately */

/* =========================================================
   COPY REFERRAL
========================================================= */
function copyRefLink(){

    const input=
        document.getElementById(
            'refLinkInput'
        );

    if(!input){
        return;
    }

    if(
        navigator.clipboard &&
        navigator.clipboard.writeText
    ){

        navigator.clipboard.writeText(
            input.value
        )
        .then(()=>{
            alert(
                'Referral link copied!'
            );
        })
        .catch(()=>{
            fallbackCopy(input);
        });

    }else{

        fallbackCopy(input);
    }
}

function fallbackCopy(input){

    input.select();

    try{
        document.execCommand('copy');
        alert(
            'Referral link copied!'
        );
    }catch(e){
        alert(
            'Copy failed. Please copy manually.'
        );
    }
}
